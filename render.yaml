services:
  - type: web
    name: careful
    runtime: python
    rootDir: ledger_app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    disk:
      name: careful-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/ledger.db
