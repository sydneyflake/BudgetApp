<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bloom — monthly budget</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div id="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-flower" viewBox="0 0 40 40" width="22" height="22">
        <g fill="var(--violet)">
          <ellipse cx="20" cy="12" rx="6" ry="9"/>
          <ellipse cx="20" cy="28" rx="6" ry="9"/>
          <ellipse cx="12" cy="20" rx="9" ry="6"/>
          <ellipse cx="28" cy="20" rx="9" ry="6"/>
        </g>
        <circle cx="20" cy="20" r="5" fill="var(--pink)"/>
      </svg>
      Bloom
    </div>

    <div class="month-nav">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>

    <nav class="side-tabs">
      <button data-tab="dashboard" class="active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 3v9l6 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Dashboard
      </button>
      <button data-tab="entries">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Entries
      </button>
    </nav>

    <div class="sidebar-stats">
      <div class="stat">
        <span class="stat-label">Income</span>
        <span class="stat-val mono income" id="sideIncome">$0.00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Expenses</span>
        <span class="stat-val mono expense" id="sideExpense">$0.00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Net</span>
        <span class="stat-val mono" id="sideNet">$0.00</span>
      </div>
    </div>

    <button class="add-btn" id="addBtn">
      <span>+</span> Add entry
    </button>
  </aside>

  <main>
    <section id="tab-dashboard">
      <div class="dash-top">
        <div class="card ring-card">
          <h3>Overall budget</h3>
          <div class="ring-wrap">
            <svg id="ringSvg" viewBox="0 0 220 220" width="220" height="220"></svg>
            <div class="ring-center">
              <div class="ring-spent mono" id="ringSpent">$0</div>
              <div class="ring-of">of <span class="mono" id="ringBudget">$0</span> budget</div>
            </div>
          </div>
          <div class="ring-legend" id="ringLegend"></div>
        </div>

        <div class="card categories-card">
          <h3>Category budgets</h3>
          <div id="categoryList"></div>
        </div>
      </div>
    </section>

    <section id="tab-entries" style="display:none">
      <div class="card">
        <div class="card-head-row">
          <h3>Entries — <span id="entriesMonthLabel"></span></h3>
        </div>
        <div id="entriesList"></div>
      </div>
    </section>
  </main>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h3>Add an entry</h3>
    <div class="type-toggle">
      <button type="button" id="typeExpense" class="active expense">Expense</button>
      <button type="button" id="typeIncome" class="income">Income</button>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Amount</label>
        <input type="number" step="0.01" min="0" class="mono" id="fAmount" placeholder="0.00">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="fCategory">
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Note (optional)</label>
      <input type="text" id="fNote" placeholder="e.g. grocery run">
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save entry</button>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = {{ categories | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
